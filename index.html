<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    rel="stylesheet">

  <title>Frontend Mentor | Huddle landing page with single introductory section</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme {
        --font-poppins: "Poppins", sans-serif;
        --font-open-sans: "Open Sans", sans-serif;
        --color-purple-700: hsl(257, 40%, 49%);
        --color-magenta-400: hsl(300, 69%, 71%);
        --background-image-desktop-bg: url('./images/bg-desktop.svg');
        --background-image-mobile-bg: url('./images/bg-mobile.svg');
      }    
      .attribution { font-size: 0.6875rem; text-align: center; }
      .attribution a { color: hsl(228, 45%, 44%); }
  </style>


</head>

<body
  class="bg-mobile-bg md:bg-desktop-bg bg-no-repeat bg-contain bg-purple-700 font-open-sans flex flex-col items-center min-h-screen text-center px-6 py-10 md:items-stretch md:text-left md:px-24 md:py-14 md:justify-between">

  <!--Logo and title-->
  <div class="justify-start">
    <img src="./images/logo.svg" alt="Hudlle Logo" class="w-24">
  </div>

  <!--Main Text-->
  <main class="flex flex-col items-center gap-10 mt-10 md:flex-row md:items-center md:gap-16 md:mt-20">
    <!--The Big Image-->
    <img src="./images/illustration-mockups.svg" alt="" class="md:max-w-none md:w-1/2">

    <!--Description-->
    <div class="flex flex-col items-center text-center gap-6 text-white md:items-start md:text-left md:w-1/2">
      <h2 class="font-poppins font-semibold text-3xl leading-tight md:text-3xl">Build The Community Your Fans Will Love</h2>

      <p class="font-normal font-open-sans md:text-xl mt-4">
        Huddle re-imagines the way we build communities. You have a voice, but so does your audience. Create connections
        with your users as you engage in genuine discussion.
      </p>

      <button
        class="w-48 bg-white text-purple-700 py-4 rounded-full shadow-[0_20px_20px_-10px_hsl(245,75%,52%,0.5)] hover:bg-magenta-400 hover:text-white transition mt-7">Register</button>
    </div>
  </main>

  <div>
    <!--Social icons-->
    <a href="#" aria-label="Facebook"
      class="w-9 h-9 rounded-full border border-white text-white flex items-center justify-center hover:border-magenta-400 hover:text-magenta-400 transition-colors duration-200">
      <svg width="9" height="18" viewBox="0 0 9 18" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M5.86 18v-8.14H8.6l.41-3.18H5.86V4.65c0-.92.26-1.55 1.58-1.55h1.68V.28C8.83.24 7.74.15 6.46.15c-2.66 0-4.48 1.62-4.48 4.6v2.13H0v3.18h1.98V18h3.88z" />
      </svg>
    </a>
    <a href="#" aria-label="Twitter"
      class="w-9 h-9 rounded-full border border-white text-white flex items-center justify-center hover:border-magenta-400 hover:text-magenta-400 transition-colors duration-200">
      <svg width="18" height="15" viewBox="0 0 18 15" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M18 1.78a7.4 7.4 0 0 1-2.12.58A3.7 3.7 0 0 0 17.5.27a7.4 7.4 0 0 1-2.34.89A3.68 3.68 0 0 0 8.8 4.5a10.45 10.45 0 0 1-7.59-3.85A3.68 3.68 0 0 0 2.36 5.6a3.65 3.65 0 0 1-1.67-.46v.05a3.68 3.68 0 0 0 2.95 3.6 3.7 3.7 0 0 1-1.66.06 3.68 3.68 0 0 0 3.44 2.56A7.38 7.38 0 0 1 0 12.9a10.42 10.42 0 0 0 5.64 1.65c6.77 0 10.47-5.6 10.47-10.47l-.01-.48A7.5 7.5 0 0 0 18 1.78z" />
      </svg>
    </a>
    <a href="#" aria-label="Instagram"
      class="w-9 h-9 rounded-full border border-white text-white flex items-center justify-center hover:border-magenta-400 hover:text-magenta-400 transition-colors duration-200">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="0.5" y="0.5" width="17" height="17" rx="4.5" stroke="currentColor" />
        <circle cx="9" cy="9" r="4" stroke="currentColor" />
        <circle cx="13.7" cy="4.3" r="1" fill="currentColor" />
      </svg>
    </a>

  </div>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Covenant Osiri-Wisdom</a>.
  </footer>
</body>

</html>
