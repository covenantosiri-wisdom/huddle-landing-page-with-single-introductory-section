<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    rel="stylesheet">
  
  <title>Frontend Mentor | Huddle landing page with single introductory section</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme {
        --font-poppins: "Poppins", sans-serif;
        --font-open-sans: "Open Sans", sans-serif;
        --color-purple-700: hsl(257, 40%, 49%);
        --color-magenta-400: hsl(300, 69%, 71%);
        --background-image-desktop-bg: url('./images/bg-desktop.svg');
        --background-image-mobile-bg: url('./images/bg--mobile.svg');
      }
    </style>


</head>

<body class="bg-mobile-bg md:bg-desktop-bg bg-no-repeat bg-contain bg-purple-700 font-open-sans flex flex-col justify-center min-h-screen m-7 p-7">

  <!--Logo and title-->
  <div class="justify-self-start pb-8">
    <img src="./images/logo.svg" alt="Hudlle Logo" class="">
  </div>

  <!--Main Text-->
  <main class="flex p-5">
    <!--The Big Image-->
    <img src="./images/illustration-mockups.svg" alt="">

    <!--Description-->
    <div class="p-7 m-7 text-white text-left ">
      <h2 class="font-poppins font-semibold text-4xl">Build The Community Your Fans Will Love</h2>

      <p class="font-normal font-open-sans"> 
        Huddle re-imagines the way we build communities. You have a voice, but so does your audience. Create connections
        with your users as you engage in genuine discussion.
      </p>

      <button>Register</button>
    </div>
  </main>

  <div>
    <!--Social icons-->

  </div>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Covenant Osiri-Wisdom</a>.
  </footer>
</body>

</html>
